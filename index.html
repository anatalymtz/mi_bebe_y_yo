<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Bebé y Yo - Portal Alumnos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <style>
    body {
      font-family: 'Nunito', sans-serif;
      background-color: #f0f9ff;
      background-image: radial-gradient(#cbd5e1 1.2px, transparent 1.2px), radial-gradient(#cbd5e1 1.2px, #f0f9ff 1.2px);
      background-size: 48px 48px;
      background-position: 0 0, 24px 24px;
    }
    .font-heading { font-family: 'Fredoka', cursive; }
    .card-playful {
      background: white;
      border-radius: 1.5rem;
      box-shadow: 0 10px 25px -5px rgba(14, 165, 233, 0.15), 0 8px 10px -6px rgba(14, 165, 233, 0.1);
      border: 3px solid #e0f2fe;
    }
  </style>
</head>
<body class="min-h-screen text-slate-700 pb-12">

  <!-- ENCABEZADO -->
  <header class="bg-gradient-to-r from-sky-400 via-indigo-400 to-pink-400 text-white shadow-lg p-5 rounded-b-3xl relative overflow-hidden">
    <div class="max-w-4xl mx-auto flex justify-between items-center relative z-10">
      <div class="flex items-center space-x-3">
        <div class="bg-white/30 backdrop-blur-md p-3 rounded-2xl shadow-inner">
          <i class="fa-solid fa-baby text-3xl text-yellow-300"></i>
        </div>
        <div>
          <h1 class="text-2xl font-black font-heading tracking-wide">¡Mi Bebé y Yo!</h1>
          <p class="text-xs font-bold text-sky-100">Maternidad y Paternidad Responsable</p>
        </div>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto p-4 space-y-6 mt-4">
    <!-- VISTA ALUMNO -->
    <section class="space-y-6">
      <div class="card-playful p-6 max-w-lg mx-auto text-center space-y-4 border-t-8 border-t-sky-400">
        <div class="w-16 h-16 bg-sky-100 text-sky-500 rounded-full flex items-center justify-center mx-auto text-2xl shadow-inner">
          <i class="fa-solid fa-magnifying-glass"></i>
        </div>
        <h2 class="text-xl font-black font-heading text-slate-800">¿Cómo va tu bebé hoy?</h2>
        <p class="text-xs text-slate-500 font-medium">Escribe tu código de alumno para consultar tu saldo.</p>
        
        <div class="flex gap-2">
          <input type="text" id="alumno-codigo-input" placeholder="Ej. ALU-1234" class="flex-1 p-3 border-2 border-sky-200 rounded-2xl text-center font-mono font-bold text-sm uppercase focus:ring-4 focus:ring-sky-200 outline-none">
          <button onclick="consultarAlumnoPorCodigo()" class="bg-sky-500 hover:bg-sky-600 text-white font-black px-6 py-3 rounded-2xl text-sm shadow-md transition active:scale-95 font-heading">
            Ver Saldo
          </button>
        </div>
      </div>

      <div id="resultado-alumno" class="hidden space-y-6">
        <div class="bg-gradient-to-br from-indigo-500 via-sky-500 to-teal-400 text-white p-6 rounded-3xl shadow-xl border-4 border-white relative overflow-hidden">
          <div class="flex justify-between items-start mb-6 relative z-10">
            <div>
              <span class="bg-white/20 px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider backdrop-blur-sm">Cuidando a:</span>
              <h3 id="student-view-nombre" class="text-3xl font-black font-heading mt-1">---</h3>
              <p class="text-sm text-sky-100 mt-1 flex items-center gap-2">
                <span class="bg-white/30 px-2.5 py-0.5 rounded-lg text-xs">👶 Bebé: <b id="student-view-bebe" class="text-white">---</b></span>
                <span id="student-view-grupo-badge" class="bg-amber-400 text-amber-950 font-black px-2 py-0.5 rounded-md text-xs font-mono">6°A</span>
              </p>
            </div>
            <div class="text-right bg-white/20 backdrop-blur-md p-3 rounded-2xl border border-white/30">
              <span class="text-xs text-sky-100 font-bold block uppercase">Dinero Disponible</span>
              <span id="student-view-saldo" class="text-4xl font-black text-yellow-300 font-heading">$0</span>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-3 pt-4 border-t border-white/20 text-center relative z-10">
            <div class="bg-emerald-500/30 border border-emerald-300/40 rounded-2xl p-3 backdrop-blur-sm">
              <span class="text-xs text-emerald-100 block font-bold">✨ Ganado hoy</span>
              <span id="student-view-ganado" class="text-xl font-black text-emerald-200 font-heading">+$0</span>
            </div>
            <div class="bg-rose-500/30 border border-rose-300/40 rounded-2xl p-3 backdrop-blur-sm">
              <span class="text-xs text-rose-100 block font-bold">💸 Gastado hoy</span>
              <span id="student-view-perdido" class="text-xl font-black text-rose-200 font-heading">-$0</span>
            </div>
          </div>
        </div>

        <div class="card-playful p-5 space-y-4">
          <h4 class="font-black text-base font-heading text-slate-700 flex items-center gap-2">
            <i class="fa-solid fa-receipt text-sky-500"></i> Bitácora de Movimientos
          </h4>
          <div id="student-view-historial" class="space-y-2 max-h-[350px] overflow-y-auto pr-1"></div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const FIREBASE_URL = "https://mi-bebe-y-yo-233db-default-rtdb.firebaseio.com/";
    firebase.initializeApp({ databaseURL: FIREBASE_URL });
    const db = firebase.database();

    let alumnosObj = {};

    db.ref('alumnos').on('value', snapshot => {
      alumnosObj = snapshot.val() || {};
    });

    function consultarAlumnoPorCodigo() {
      const codigo = document.getElementById('alumno-codigo-input').value.trim().toUpperCase();
      const alumno = Object.values(alumnosObj).find(a => a.id.toUpperCase() === codigo || a.nombre.toUpperCase().includes(codigo));
      const container = document.getElementById('resultado-alumno');

      if (!alumno) {
        alert('Alumno no encontrado.');
        container.classList.add('hidden');
        return;
      }

      container.classList.remove('hidden');
      document.getElementById('student-view-nombre').textContent = alumno.nombre;
      document.getElementById('student-view-bebe').textContent = alumno.bebe;
      document.getElementById('student-view-grupo-badge').textContent = `6°${alumno.grupo || 'A'}`;
      document.getElementById('student-view-saldo').textContent = `$${alumno.saldo}`;

      const hoy = new Date().toDateString();
      let ganado = 0, perdido = 0;

      (alumno.historial || []).forEach(h => {
        if (new Date(h.fecha).toDateString() === hoy) {
          if (h.monto > 0 && !h.motivo.includes('inicial')) ganado += h.monto;
          if (h.monto < 0) perdido += Math.abs(h.monto);
        }
      });

      document.getElementById('student-view-ganado').textContent = `+$${ganado}`;
      document.getElementById('student-view-perdido').textContent = `-$${perdido}`;

      document.getElementById('student-view-historial').innerHTML = (alumno.historial || []).map(h => {
        const esPos = h.monto > 0;
        return `
          <div class="flex justify-between items-center p-3 rounded-2xl border-2 ${esPos ? 'bg-emerald-50/80 border-emerald-100 text-emerald-950' : 'bg-rose-50/80 border-rose-100 text-rose-950'}">
            <div>
              <p class="font-black text-xs sm:text-sm">${h.motivo}</p>
              <p class="text-[10px] text-slate-400 font-bold">${new Date(h.fecha).toLocaleString('es-MX', { hour: '2-digit', minute: '2-digit', day: '2-digit', month: 'short' })}</p>
            </div>
            <span class="font-black text-sm font-heading ${esPos ? 'text-emerald-600' : 'text-rose-600'}">
              ${esPos ? '+' : ''}$${h.monto}
            </span>
          </div>
        `;
      }).join('');
    }
  </script>
</body>
</html>
